name: Update feed
on:
  workflow_call:
    secrets:
      SPARKLE_PRIVATE_KEY:
        required: true
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  appcast:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Generate appcast from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/update-feed.py "$RUNNER_TEMP/site"
      - name: Sign appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${SPARKLE_PRIVATE_KEY:?Missing update signing secret}"
          ./Scripts/sparkle-tools.sh "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          "$RUNNER_TEMP/sparkle/bin/sign_update" -f "$RUNNER_TEMP/sparkle-key" "$RUNNER_TEMP/site/appcast.xml"
          "$RUNNER_TEMP/sparkle/bin/sign_update" --verify -f "$RUNNER_TEMP/sparkle-key" "$RUNNER_TEMP/site/appcast.xml"
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sparkle-key"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: appcast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
